<script>
async function handleLogout(e) {
  if (e) e.preventDefault();
  try {
    await fetch('/auth/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
  } catch (err) {}
  window.location.href = '/login';
}
</script>
