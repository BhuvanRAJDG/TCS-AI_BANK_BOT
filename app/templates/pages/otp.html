{% extends "auth_base.html" %}
{% block title %}MFA OTP Verification — CBS Bank AI{% endblock %}

{% block content %}
<div class="w-full max-w-md glass-card p-8 rounded-3xl border border-slate-800 shadow-2xl shadow-blue-900/20 backdrop-blur-xl text-center">
  <div class="w-14 h-14 rounded-2xl bg-blue-600/20 text-blue-400 border border-blue-500/30 flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg shadow-blue-500/10">
    🔒
  </div>
  <h2 class="text-2xl font-bold text-white tracking-tight">Two-Factor Authentication</h2>
  <p class="text-xs text-slate-400 mt-1.5">Enter the 6-digit verification code sent to your registered contact.</p>

  <div id="error-alert" class="hidden my-4 p-3 rounded-xl bg-red-500/20 border border-red-500/40 text-red-300 text-xs font-medium text-left"></div>
  <div id="info-alert" class="hidden my-4 p-3 rounded-xl bg-blue-500/20 border border-blue-500/40 text-blue-300 text-xs font-medium text-left"></div>

  <form id="otp-form" class="mt-6 space-y-4">
    <div class="flex justify-center">
      <input type="text" id="otp-input" maxlength="6" name="otp" required autofocus class="w-56 text-center text-3xl tracking-[0.5em] font-mono py-3 rounded-xl glass-input text-white border-blue-500/40 focus:border-blue-500 outline-none" placeholder="123456">
    </div>
    <div class="p-3 rounded-xl bg-slate-900/60 border border-slate-800 text-xs text-slate-300">
      💡 Default Demo OTP: <code class="text-amber-400 font-mono font-bold">123456</code>
    </div>
    <button type="submit" id="submit-btn" class="w-full py-3 rounded-xl bg-gradient-to-r from-blue-600 via-indigo-600 to-emerald-600 font-semibold text-sm text-white shadow-lg shadow-blue-600/30 hover:opacity-95 active:scale-[0.99] transition duration-200">
      Verify & Proceed
    </button>
  </form>

  <p class="text-xs text-center text-slate-400 mt-6">
    Didn't receive the code? <a href="/login" class="text-blue-400 font-medium hover:text-blue-300 hover:underline">Back to Login</a>
  </p>
</div>

<script>
document.getElementById('otp-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('error-alert');
  const infoBox = document.getElementById('info-alert');
  const submitBtn = document.getElementById('submit-btn');

  errBox.classList.add('hidden');
  infoBox.classList.add('hidden');
  submitBtn.disabled = true;
  submitBtn.innerText = 'Verifying...';

  const otp = document.getElementById('otp-input').value.trim();

  try {
    const res = await fetch('/auth/mfa/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ otp })
    });

    const data = await res.json();

    if (!res.ok) {
      errBox.innerText = data.error || 'Invalid or expired OTP code.';
      errBox.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.innerText = 'Verify & Proceed';
      return;
    }

    infoBox.innerText = 'Verification successful! Redirecting to dashboard...';
    infoBox.classList.remove('hidden');
    setTimeout(() => { window.location.href = '/dashboard'; }, 600);
  } catch (err) {
    errBox.innerText = 'Network error during verification. Please try again.';
    errBox.classList.remove('hidden');
    submitBtn.disabled = false;
    submitBtn.innerText = 'Verify & Proceed';
  }
});
</script>
{% endblock %}
