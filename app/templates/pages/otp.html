{% extends "base.html" %}
{% block title %}MFA OTP Verification — SentinelBank AI{% endblock %}
{% block content %}
<div class="max-w-md mx-auto my-12 glass-card p-8 text-center">
  <div class="w-12 h-12 rounded-full bg-blue-600/20 text-blue-400 flex items-center justify-center mx-auto mb-4 text-xl">
    🔒
  </div>
  <h2 class="text-2xl font-bold text-white">Enter OTP</h2>
  <p class="text-xs text-slate-400 mt-1">A 6-digit passcode has been sent to your registered contact.</p>

  <div id="error-alert" class="hidden my-4 p-3 rounded-lg bg-red-500/20 border border-red-500/50 text-red-300 text-xs font-medium text-left"></div>
  <div id="info-alert" class="hidden my-4 p-3 rounded-lg bg-blue-500/20 border border-blue-500/50 text-blue-300 text-xs font-medium text-left"></div>

  <form id="otp-form" class="mt-6 space-y-4">
    <div class="flex justify-center space-x-2">
      <input type="text" id="otp-input" maxlength="6" name="otp" required class="w-48 text-center text-2xl tracking-widest font-mono py-3 rounded-lg glass-input" placeholder="123456">
    </div>
    <div class="p-3 rounded-lg bg-slate-800/60 border border-slate-700/60 text-xs text-slate-300">
      💡 Default Demo OTP: <code class="text-amber-400 font-mono font-bold">123456</code>
    </div>
    <button type="submit" id="submit-btn" class="w-full py-3 rounded-lg bg-gradient-to-r from-blue-600 to-emerald-600 font-semibold text-sm hover:opacity-90 transition">
      Verify & Proceed
    </button>
  </form>
</div>

<script>
document.getElementById('otp-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('error-alert');
  const infoBox = document.getElementById('info-alert');
  const submitBtn = document.getElementById('submit-btn');

  errBox.classList.add('hidden');
  infoBox.classList.add('hidden');
  submitBtn.disabled = true;
  submitBtn.innerText = 'Verifying...';

  const otp = document.getElementById('otp-input').value.trim();

  try {
    const res = await fetch('/auth/mfa/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ otp })
    });

    const data = await res.json();

    if (!res.ok) {
      errBox.innerText = data.error || 'Invalid or expired OTP code.';
      errBox.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.innerText = 'Verify & Proceed';
      return;
    }

    infoBox.innerText = 'Verification successful! Redirecting to dashboard...';
    infoBox.classList.remove('hidden');
    setTimeout(() => { window.location.href = '/dashboard'; }, 800);
  } catch (err) {
    errBox.innerText = 'Network error during verification. Please try again.';
    errBox.classList.remove('hidden');
    submitBtn.disabled = false;
    submitBtn.innerText = 'Verify & Proceed';
  }
});
</script>
{% endblock %}
